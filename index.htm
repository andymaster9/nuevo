<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tarjeta de Producto</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="tarjeta">
<img src="https://via.placeholder.com/300" alt="Imagen del producto" class="imagen-producto">

<div class="contenido">
<p class="categoria">PERFUME</p>
<h1 class="titulo">Gabrielle Essence Eau De Parfum</h1>
<p class="descripcion">
Una interpretación floral y solar compuesta por Olivier Polge, perfumista de la Casa CHANEL.
</p>

<div class="precios">
<span class="precio-actual">$149.99</span>
<span class="precio-anterior">$169.99</span>
</div>

<button class="boton-agregar">Añadir al carrito</button>
</div>
</div>

</body>
</html>
